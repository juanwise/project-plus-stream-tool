<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Plus Scoreboard</title>
<link rel="stylesheet" href="theme.css">
<style>
  #bar { position: absolute; top: 34px; left: 160px; width: 1600px; height: 120px; display: flex; align-items: stretch; }
  .side { position: relative; width: 620px; height: 120px; display: flex; }
  #side2 { flex-direction: row-reverse; }
  .face { width: 120px; height: 120px; position: relative; flex: none; background: linear-gradient(var(--green), var(--deep)); border: 5px solid var(--lime); overflow: hidden; z-index: 2; }
  .face::before { content: ""; position: absolute; inset: 0; background: var(--plus-pattern); background-size: 80px 80px; opacity: .9; }
  .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .plate { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; min-width: 0; background: linear-gradient(90deg, var(--ink), var(--mid) 70%, var(--card1)); border-top: 5px solid var(--lime); }
  #side2 .plate { align-items: flex-end; background: linear-gradient(270deg, var(--ink), var(--mid) 70%, var(--card1)); }
  .line { display: inline-flex; align-items: center; height: 58px; max-width: 100%; overflow: hidden; }
  #img2.mirror { transform: scaleX(-1); }
  .flag { display:block; width:42px; height:28px; object-fit:cover; margin:0 9px; border:2px solid rgba(255,255,255,.8); border-radius:2px; box-shadow:0 2px 5px rgba(0,0,0,.6); flex:none; }
  .flag.none { display:none; }
  .team { color: var(--lime); font-size: 28px; line-height: 58px; margin-right: 12px; }
  .team:empty { display: none; }
  .team.has::after { content: "|"; margin-left: 12px; color: var(--mint); opacity: .55; }
  .name { font-size: 50px; font-weight: 900; line-height: 58px; letter-spacing: -.5px; }
  .charname { font-size: 20px; color: var(--muted); letter-spacing: 3px; height: 24px; line-height: 24px; }
  .score { width: 112px; height: 120px; flex: none; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center;
    font-size: 84px; font-weight: 900; color: var(--ink); background: linear-gradient(160deg, var(--acc2), var(--bright)); border-top: 5px solid var(--limepale); }
  .score span { display: block; line-height: 1; }
  #side1 .plate { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  .pips { position: absolute; top: 128px; display: flex; gap: 8px; z-index: 1; }
  #pips1 { left: 132px; } #pips2 { right: 132px; flex-direction: row-reverse; }   /* player 2's pips fill from the outside in, like a mirror image */
  .pip { width: 34px; height: 34px; }
  .pip path { fill: rgba(var(--ink-rgb),.55); stroke: rgba(var(--mint-rgb),.5); stroke-width: 5; stroke-linejoin: round; }
  .pip.on path { fill: var(--lime); stroke: var(--ink); stroke-width: 7; }
  .pip.on { filter: drop-shadow(0 0 6px rgba(var(--lime-rgb),.8)); }

  #center { position: relative; width: 360px; height: 120px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--ink), var(--deep)); border-top: 5px solid var(--lime); z-index: 3; }
  #center::before, #center::after { content: ""; position: absolute; top: -5px; bottom: 0; width: 26px; background: inherit; border-top: 5px solid var(--lime); }
  #center::before { left: -25px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  #center::after { right: -25px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
  #round { font-size: 34px; font-weight: 900; line-height: 40px; width: 340px; text-align: center; overflow: hidden; }
  #round.reset { color: var(--lime); }
  #bestof { font-size: 20px; letter-spacing: 6px; color: var(--muted); line-height: 26px; }
  #userlogo { position: absolute; left: 810px; top: 168px; width: 300px; height: 84px; object-fit: contain; }
  #logo { position: absolute; top: -34px; left: 50%; margin-left: -30px; width: 60px; height: 60px; z-index: 4; }
</style>
</head>
<body>
  <img id="userlogo" alt="">
  <div id="bar">
    <div id="side1" class="side">
      <div class="face"><img id="img1" alt=""></div>
      <div class="plate"><div class="line"><span id="team1" class="team"></span><img id="flag1" class="flag none" alt="" /><span id="name1" class="name"></span></div><div id="char1" class="charname"></div></div>
      <div class="score"><span id="score1">0</span></div>
      <div id="pips1" class="pips"></div>
    </div>
    <div id="center"><div id="logo"></div><div id="round"></div><div id="bestof"></div></div>
    <div id="side2" class="side">
      <div class="face"><img id="img2" alt=""></div>
      <div class="plate"><div class="line"><span id="team2" class="team"></span><span id="name2" class="name"></span><img id="flag2" class="flag none" alt="" /></div><div id="char2" class="charname"></div></div>
      <div class="score"><span id="score2">0</span></div>
      <div id="pips2" class="pips"></div>
    </div>
  </div>

<script src="themes.js"></script>
<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('logo').innerHTML = PP.plusSvg(60);
  const PIP = '<svg class="pip %C" viewBox="0 0 100 100"><path d="M34 6h32v28h28v32H66v28H34V66H6V34h28z"/></svg>';
  const side = (p) => ({ name: p.name, team: p.team, country: p.country, character: p.character, alt: p.alt });

  function fit(n) {
    const name = $('name' + n), team = $('team' + n), line = name.parentElement, avail = line.parentElement.clientWidth - 48;
    let size = 50; name.style.fontSize = ''; team.style.fontSize = '';
    while (line.scrollWidth > avail && size > 18) {
      size -= 2; name.style.fontSize = size + 'px'; team.style.fontSize = Math.round(size * .56) + 'px';
    }
  }

  PP.onState((s, prev) => {
    PP.setLogo($('userlogo'));
    const need = PP.firstTo(s);
    [0, 1].forEach((i) => {
      const n = i + 1, p = s.players[i];
      PP.setText($('name' + n), p.name);
      PP.setText($('team' + n), p.team);
      const flag = $('flag' + n);
      flag.onerror = () => flag.classList.add('none');
      if (p.country) { flag.classList.remove('none'); PP.setImg(flag, '/flag/' + p.country); } else { flag.classList.add('none'); PP.setImg(flag, ''); }
      $('team' + n).classList.toggle('has', !!p.team);
      PP.setText($('char' + n), PP.charName(p.character));
      PP.setImg($('img' + n), PP.art(p.character, p.alt));
      fit(n);
      if (i === 1) $('img2').classList.toggle('mirror', !!s.mirrorPlayer2);
      PP.setText($('score' + n), String(p.score));
      $('pips' + n).innerHTML = Array.from({ length: need }, (_, k) => PIP.replace('%C', k < p.score ? 'on' : '')).join('');
      if (prev && prev.players[i].score !== p.score) PP.pulse($('score' + n));
      if (!prev || !PP.same(side(p), side(prev.players[i]))) PP.slideIn($('side' + n), i === 0 ? 'left' : 'right', 0);
    });
    PP.setText($('round'), PP.roundLabel(s) || ' ');
    PP.fitText($('round'), 336, 34, 16);
    $('round').classList.toggle('reset', !!(s.grandFinals.on && s.grandFinals.reset));
    PP.setText($('bestof'), 'Best of ' + s.bestOf);
    if (!prev || PP.roundLabel(prev) !== PP.roundLabel(s) || prev.bestOf !== s.bestOf) PP.slideIn($('center'), 'down', 100);
  });
  document.fonts.ready.then(() => { fit(1); fit(2); PP.fitText($('round'), 336, 34, 16); });
</script>
</body>
</html>
