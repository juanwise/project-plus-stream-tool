<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Plus Top 8</title>
<link rel="stylesheet" href="theme.css">
<style>
  #title { position: absolute; left: 0; width: 1920px; top: 14px; height: 124px; display: flex; align-items: center; justify-content: center; gap: 28px; z-index: 2; }
  #title h1 { margin: 0; font-size: 92px; font-weight: 900; font-style: italic; line-height: 96px; letter-spacing: -3px; text-align: center; text-shadow: 0 5px 0 rgba(0,0,0,.55); }
  #title .ul { height: 110px; max-width: 210px; width: auto; object-fit: contain; }
  #tournament { font-size: 28px; letter-spacing: 6px; color: var(--mint); text-align: center; height: 30px; line-height: 30px; }
  /* 1st place: one big box on top, centred. 2nd to 8th: seven boxes of the same size in a row below it. */
  .card { position: absolute; overflow: hidden; z-index: 2; background: linear-gradient(170deg, var(--card1), var(--card2) 78%);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 26px 100%, 0 calc(100% - 26px)); }
  .card::before { content: ""; position: absolute; inset: 0; background: var(--plus-pattern); background-size: 120px 120px; opacity: .9; }
  .card .art { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--info)); object-fit: contain; object-position: center bottom; filter: drop-shadow(0 8px 12px rgba(0,0,0,.5)); }
  .card .info { position: absolute; left: 0; right: 0; bottom: 0; height: var(--info); background: linear-gradient(90deg, var(--ink), var(--mid) 50%, var(--ink)); border-top: 5px solid var(--lime);
    padding: 0 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card .team { color: var(--lime); height: var(--teamh); line-height: var(--teamh); font-size: calc(var(--teamh) * .75); letter-spacing: 2px; }
  .card .name { height: var(--nameh); line-height: var(--nameh); font-size: calc(var(--nameh) * .78); font-weight: 900; letter-spacing: -.5px; }
  .card.small { top: 640px; width: 240px; height: 410px; --info: 112px; --teamh: 28px; --nameh: 52px; }
  .card.first { left: 580px; top: 150px; width: 760px; height: 470px; --info: 150px; --teamh: 36px; --nameh: 84px; }
  .card.first::after { content: ""; position: absolute; inset: 0; border: 6px solid var(--lime); z-index: 4; pointer-events: none; }
  .card.first .info { border-top-color: var(--limepale); background: linear-gradient(90deg, var(--ink), var(--mid2), var(--ink)); }
  .place { position: absolute; left: 12px; top: 10px; z-index: 3; width: 80px; height: 80px; }
  .first .place { width: 120px; height: 120px; left: 20px; top: 16px; }
  .place svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .place span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--ink); padding-bottom: 2px; font-size: 38px; }
  .first .place span { font-size: 60px; }
  .flag { position: absolute; right: 12px; top: 14px; z-index: 3; width: 66px; height: 44px; object-fit: cover; border: 3px solid var(--ink); box-shadow: 0 3px 8px rgba(0,0,0,.5); background: var(--ink); }
  .first .flag { right: 20px; top: 20px; width: 110px; height: 73px; border-width: 4px; }
  .flag.none { display: none; }
  .card.empty .art { visibility: hidden; }
</style>
</head>
<body>
  <div class="pp-bg"></div>
  <div id="title"><div id="titlelogo"></div><div><h1>Top 8</h1><div id="tournament"></div></div><div id="titlelogo2"></div></div>
  <div id="grid"></div>

<script src="themes.js"></script>
<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  // seven small boxes are centred as a group: 7 x 240 + 6 x 15 = 1770, 75 px from each edge
  for (let i = 0; i < 8; i++) {
    const c = document.createElement('div');
    c.id = 'card' + i;
    c.className = i === 0 ? 'card first' : 'card small';
    if (i) c.style.left = (75 + (i - 1) * 255) + 'px';
    c.innerHTML = `<img class="art" alt=""><img class="flag none" alt=""><div class="place">${PP.plusSvg(130)}<span>${i + 1}</span></div>
      <div class="info"><span class="team"></span><span class="name"></span></div>`;
    grid.appendChild(c);
  }
  const key = (p) => ({ name: p.name, team: p.team, character: p.character, alt: p.alt, country: p.country });

  function fit(c) {
    const name = c.querySelector('.name'), avail = c.clientWidth - 36;
    name.style.width = 'max-content'; name.style.fontSize = '';
    let size = parseFloat(getComputedStyle(name).fontSize);
    while (name.offsetWidth > avail && size > 16) { size -= 2; name.style.fontSize = size + 'px'; }
    name.style.width = '';
  }

  PP.onState((s, prev) => {
    ['titlelogo', 'titlelogo2'].forEach((id) => {
      const want = PP.logoSrc ? 'logo:' + PP.logoSrc : 'plus', el = $(id);
      if (el.dataset.kind !== want) { el.dataset.kind = want; el.innerHTML = PP.logoSrc ? `<img class="ul" src="${PP.logoSrc}" alt="">` : PP.plusSvg(110); }
    });
    PP.setText($('tournament'), s.tournament || ' ');
    s.top8.forEach((p, i) => {
      const c = $('card' + i);
      PP.setText(c.querySelector('.name'), p.name);
      PP.setText(c.querySelector('.team'), p.team);
      PP.setImg(c.querySelector('.art'), PP.art(p.character, p.alt));
      c.classList.toggle('empty', !p.character);
      const flag = c.querySelector('.flag');
      flag.onerror = () => flag.classList.add('none');       // flag could not be downloaded: just hide it
      if (p.country) { flag.classList.remove('none'); const src = '/flag/' + p.country; if (flag.getAttribute('src') !== src) flag.src = src; } else flag.classList.add('none');
      fit(c);
      if (!prev || !PP.same(key(p), key(prev.top8[i]))) PP.slideIn(c, 'up', i === 0 ? 0 : 120 + 50 * i);
    });
  });
  document.fonts.ready.then(() => document.querySelectorAll('.card').forEach(fit));
</script>
</body>
</html>
