<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Plus VS Screen</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Everything is placed from the centre line (x = 960): the right side uses the same numbers as the left. */
  #geo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 1; }

  .artbox { position: absolute; bottom: 170px; width: 820px; height: 860px; z-index: 3; }
  #art1 { left: 30px; } #art2 { right: 30px; }
  .artbox img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 14px 22px rgba(0,0,0,.55)); }
  #art2.mirror img { transform: scaleX(-1); }

  /* name plates: text rows have fixed positions and heights, so both sides line up whatever the font size */
  .txt { position: absolute; width: 800px; z-index: 5; }
  #txt1 { left: 70px; text-align: left; } #txt2 { right: 70px; text-align: right; }
  .row { position: absolute; left: 0; right: 0; top: 14px; height: 90px; display: flex; align-items: center; }
  #txt1 .row { justify-content: flex-start; } #txt2 .row { justify-content: flex-end; }
  .line { display: inline-flex; align-items: center; max-width: 800px; }
  .flag { display:block; width:64px; height:42px; object-fit:cover; margin:0 14px; border:3px solid rgba(255,255,255,.88); border-radius:3px; box-shadow:0 3px 8px rgba(0,0,0,.65); flex:none; }
  .flag.none { display:none; }
  #txt2 .flag { order: 2; }
  .name { font-size: 78px; font-weight: 900; line-height: 90px; letter-spacing: -1px; }
  .team { color: var(--lime); font-weight: 800; margin-right: 18px; font-size: 54px; line-height: 90px; }
  .team:empty { display: none; }
  .team.has::after { content: "|"; margin-left: 18px; color: var(--mint); opacity: .6; }
  .char { position: absolute; left: 0; right: 0; top: 106px; height: 36px; font-size: 30px; color: var(--muted); font-weight: 800; letter-spacing: 3px; line-height: 36px; }

  #center { position: absolute; left: 610px; width: 700px; top: 0; height: 230px; text-align: center; z-index: 6; }
  #center::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(var(--ink-rgb),.94), rgba(var(--deep-rgb),.9)); border-bottom: 6px solid var(--lime);
    clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%); }
  #tournament { padding-top: 34px; font-size: 32px; letter-spacing: 6px; color: var(--mint); height: 70px; }
  #round { height: 74px; font-size: 62px; font-weight: 900; line-height: 74px; text-shadow: 0 3px 0 rgba(0,0,0,.6); }
  #round.reset { color: var(--lime); }
  #bestof { font-size: 26px; letter-spacing: 8px; color: var(--muted); height: 34px; line-height: 34px; }
  #userlogo { position: absolute; left: 850px; top: 770px; width: 220px; height: 200px; object-fit: contain; z-index: 7; }
  #vs { position: absolute; left: 760px; top: 340px; width: 400px; height: 400px; z-index: 6; }
  #vs svg { position: absolute; inset: 0; width: 400px; height: 400px; }
  #vs span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 118px; font-weight: 900; font-style: italic;
    color: var(--ink); letter-spacing: -4px; padding-bottom: 8px; }
</style>
</head>
<body>
  <div class="pp-bg"></div>
  <svg id="geo" viewBox="0 0 1920 1080"></svg>

  <div id="art1" class="artbox"><img id="img1" alt=""></div>
  <div id="art2" class="artbox"><img id="img2" alt=""></div>

  <div id="vs"><span>VS</span></div>
  <img id="userlogo" alt="">

  <div id="center">
    <div id="tournament"></div>
    <div id="round"></div>
    <div id="bestof"></div>
  </div>

  <div id="txt1" class="txt"><div class="row"><div class="line"><span id="team1" class="team"></span><img id="flag1" class="flag none" alt="" /><span id="name1" class="name"></span></div></div><div id="char1" class="char"></div></div>
  <div id="txt2" class="txt"><div class="row"><div class="line"><span id="team2" class="team"></span><span id="name2" class="name"></span><img id="flag2" class="flag none" alt="" /></div></div><div id="char2" class="char"></div></div>

<script src="themes.js"></script>
<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  document.getElementById('vs').insertAdjacentHTML('afterbegin', PP.plusSvg(400));

  // ---- geometry: points are written for the left side only, the right side is their mirror image ----
  const W = 1920;
  const mirror = (pts) => pts.map(([x, y]) => [W - x, y]);
  const poly = (pts) => pts.map((p) => p.join(',')).join(' ');
  const PANEL = [[0, 0], [930, 0], [790, 1080], [0, 1080]];                 // big slanted panel
  const PLATE = [[0, 880], [900, 880], [840, 1030], [0, 1030]];             // name plate
  const PLATE_TOP = [[0, 880], [900, 880]];
  const EDGE = [[930, 0], [790, 1080]];
  const parts = (pts, m) => (m ? mirror(pts) : pts);
  let svg = `<defs>
    <linearGradient id="pg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ink)" stop-opacity=".9"/><stop offset=".6" style="stop-color:var(--deep)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--green)" stop-opacity=".55"/></linearGradient>
    <linearGradient id="pg2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:var(--ink)" stop-opacity=".9"/><stop offset=".6" style="stop-color:var(--deep)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--green)" stop-opacity=".55"/></linearGradient>
    <linearGradient id="pl1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ink)"/><stop offset=".6" style="stop-color:var(--mid)"/><stop offset="1" style="stop-color:var(--green)"/></linearGradient>
    <linearGradient id="pl2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:var(--ink)"/><stop offset=".6" style="stop-color:var(--mid)"/><stop offset="1" style="stop-color:var(--green)"/></linearGradient>
    <pattern id="plusPat" width="160" height="160" patternUnits="userSpaceOnUse"><g fill="#fff"><path opacity=".10" d="M68 40h24v28h28v24H92v28H68V92H40V68h28z"/></g></pattern>
    <filter id="glow" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>`;
  [false, true].forEach((m, i) => {
    const g = i + 1;
    svg += `<polygon points="${poly(parts(PANEL, m))}" fill="url(#pg${g})"/>
      <polygon points="${poly(parts(PANEL, m))}" fill="url(#plusPat)"/>
      <polyline points="${poly(parts(EDGE, m))}" fill="none" style="stroke:var(--lime)" stroke-width="22" opacity=".55" filter="url(#glow)"/>
      <polyline points="${poly(parts(EDGE, m))}" fill="none" style="stroke:var(--lime)" stroke-width="10"/>
      <polygon points="${poly(parts(PLATE, m))}" fill="url(#pl${g})"/>
      <polyline points="${poly(parts(PLATE_TOP, m))}" style="stroke:var(--lime)" stroke-width="6" fill="none"/>`;
  });
  document.getElementById('geo').innerHTML = svg;
  // text boxes follow the plate: top of the plate + same offsets on both sides
  ['txt1', 'txt2'].forEach((id) => { $(id).style.top = '886px'; $(id).style.height = '144px'; });

  const side = (p) => ({ name: p.name, team: p.team, country: p.country, character: p.character, alt: p.alt });
  function fitName(n) {   // shrink long "team | name" lines so they stay inside the plate
    const name = $('name' + n), team = $('team' + n), line = name.parentElement;
    let size = 78;
    name.style.fontSize = ''; team.style.fontSize = '';
    while (line.scrollWidth > 800 && size > 30) {
      size -= 3; name.style.fontSize = size + 'px'; team.style.fontSize = Math.round(size * .69) + 'px';
    }
  }

  PP.onState((s, prev) => {
    PP.setLogo($('userlogo'));
    [0, 1].forEach((i) => {
      const n = i + 1, p = s.players[i];
      const changed = !prev || !PP.same(side(p), side(prev.players[i])) || s.mirrorPlayer2 !== prev.mirrorPlayer2;
      PP.setText($('name' + n), p.name);
      PP.setText($('team' + n), p.team);
      const flag = $('flag' + n);
      flag.onerror = () => flag.classList.add('none');
      if (p.country) { flag.classList.remove('none'); PP.setImg(flag, '/flag/' + p.country); } else { flag.classList.add('none'); PP.setImg(flag, ''); }
      $('team' + n).classList.toggle('has', !!p.team);
      PP.setText($('char' + n), PP.charName(p.character));
      PP.setImg($('img' + n), PP.art(p.character, p.alt));
      fitName(n);
      if (i === 1) $('art2').classList.toggle('mirror', !!s.mirrorPlayer2);
      if (changed) {
        const dir = i === 0 ? 'left' : 'right';
        PP.slideIn($('art' + n), dir, 80);
        PP.slideIn($('txt' + n), dir, 0);
      }
    });
    const round = PP.roundLabel(s);
    const centerKey = [round, s.tournament, s.bestOf];
    PP.setText($('tournament'), s.tournament);
    PP.setText($('round'), round);
    PP.fitText($('round'), 660, 62, 28);
    $('round').classList.toggle('reset', !!(s.grandFinals.on && s.grandFinals.reset));
    PP.setText($('bestof'), 'Best of ' + s.bestOf);
    if (!prev || !PP.same(centerKey, [PP.roundLabel(prev), prev.tournament, prev.bestOf])) {
      PP.slideIn($('center'), 'down', 100);
      PP.anim($('vs'), [{ opacity: 0, transform: 'scale(.4) rotate(-90deg)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 150 });
    }
  });
  document.fonts.ready.then(() => { fitName(1); fitName(2); PP.fitText($('round'), 660, 62, 28); });
</script>
</body>
</html>
