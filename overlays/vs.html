<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Plus VS Screen</title>
<link rel="stylesheet" href="theme.css">
<style>
  .panel { position: absolute; top: 0; bottom: 0; width: 1100px; z-index: 1; }
  #panel1 { left: 0; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
    background: linear-gradient(100deg, rgba(3,16,8,.88) 0%, rgba(5,54,30,.78) 55%, rgba(12,155,85,.55) 100%); }
  #panel2 { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 22% 100%);
    background: linear-gradient(260deg, rgba(3,16,8,.88) 0%, rgba(5,54,30,.78) 55%, rgba(12,155,85,.55) 100%); }
  .panel::after { content: ""; position: absolute; inset: 0; background: var(--plus-pattern); background-size: 160px 160px; opacity: .8; }
  .edge { position: absolute; top: -40px; bottom: -40px; width: 10px; background: linear-gradient(var(--lime), var(--bright)); z-index: 2; box-shadow: 0 0 24px rgba(140,255,79,.7); }
  #edge1 { left: 868px; transform: skewX(-13.6deg); }   /* follows the slanted edge of panel 1 */
  #edge2 { right: 868px; transform: skewX(-13.6deg); }

  .artbox { position: absolute; bottom: 170px; width: 820px; height: 860px; z-index: 3; }
  #art1 { left: 30px; } #art2 { right: 30px; }
  .artbox img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 14px 22px rgba(0,0,0,.55)); }
  #art2.mirror img { transform: scaleX(-1); }

  .plate { position: absolute; bottom: 52px; height: 150px; width: 960px; z-index: 5; padding: 0 70px; display: flex; flex-direction: column; justify-content: center; }
  .plate::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #031008, #08502c 60%, #0c9b55); border-top: 6px solid var(--lime); }
  #plate1 { left: 0; clip-path: polygon(0 0, 100% 0, 93% 100%, 0 100%); align-items: flex-start; }
  #plate2 { right: 0; clip-path: polygon(7% 0, 100% 0, 100% 100%, 0 100%); align-items: flex-end; }
  #plate2::before { background: linear-gradient(270deg, #031008, #08502c 60%, #0c9b55); }
  .line { display: inline-flex; align-items: baseline; max-width: 820px; }
  .name { font-size: 78px; font-weight: 900; line-height: 84px; letter-spacing: -1px; }
  .team { color: var(--lime); font-weight: 800; margin-right: 18px; font-size: 54px; }
  .team:empty { display: none; }
  .team.has::after { content: "|"; margin-left: 18px; color: var(--mint); opacity: .6; }
  .char { font-size: 30px; color: var(--muted); font-weight: 800; letter-spacing: 3px; line-height: 36px; }

  #center { position: absolute; left: 610px; width: 700px; top: 0; height: 230px; text-align: center; z-index: 6; }
  #center::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 100%; z-index: -1;
    background: linear-gradient(180deg, rgba(3,16,8,.94), rgba(5,54,30,.9)); border-bottom: 6px solid var(--lime);
    clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%); }
  #tournament { padding-top: 34px; font-size: 32px; letter-spacing: 6px; color: var(--mint); }
  #round { font-size: 62px; font-weight: 900; line-height: 74px; margin-top: 6px; text-shadow: 0 3px 0 rgba(0,0,0,.6); }
  #round.reset { color: var(--lime); }
  #bestof { font-size: 26px; letter-spacing: 8px; color: var(--muted); margin-top: 4px; }
  #vs { position: absolute; left: 760px; top: 340px; width: 400px; height: 400px; z-index: 6; }
  #vs svg { position: absolute; inset: 0; width: 400px; height: 400px; }
  #vs span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 118px; font-weight: 900; font-style: italic;
    color: #03150a; letter-spacing: -4px; text-shadow: 0 0 0 transparent; padding-bottom: 8px; }
</style>
</head>
<body>
  <div class="pp-bg"></div>
  <div id="panel1" class="panel"></div>
  <div id="panel2" class="panel"></div>
  <div id="edge1" class="edge"></div>
  <div id="edge2" class="edge"></div>

  <div id="art1" class="artbox"><img id="img1" alt=""></div>
  <div id="art2" class="artbox"><img id="img2" alt=""></div>

  <div id="vs"><span>VS</span></div>

  <div id="center">
    <div id="tournament"></div>
    <div id="round"></div>
    <div id="bestof"></div>
  </div>

  <div id="plate1" class="plate"><div class="line"><span id="team1" class="team"></span><span id="name1" class="name"></span></div><div id="char1" class="char"></div></div>
  <div id="plate2" class="plate"><div class="line"><span id="team2" class="team"></span><span id="name2" class="name"></span></div><div id="char2" class="char"></div></div>

<script src="common.js"></script>
<script>
  document.getElementById('vs').insertAdjacentHTML('afterbegin', PP.plusSvg(400));
  const $ = (id) => document.getElementById(id);
  const side = (p) => ({ name: p.name, team: p.team, character: p.character, alt: p.alt });

  function fitName(n) {   // shrink long "team | name" lines so they stay inside the plate
    const name = $('name' + n), team = $('team' + n), line = name.parentElement;
    let size = 78;
    name.style.fontSize = ''; team.style.fontSize = '';
    while (line.scrollWidth > 820 && size > 30) {
      size -= 3; name.style.fontSize = size + 'px'; team.style.fontSize = Math.round(size * .69) + 'px';
      name.style.lineHeight = Math.round(size * 1.08) + 'px';
    }
  }

  PP.onState((s, prev) => {
    [0, 1].forEach((i) => {
      const n = i + 1, p = s.players[i];
      const changed = !prev || !PP.same(side(p), side(prev.players[i])) || s.mirrorPlayer2 !== prev.mirrorPlayer2;
      PP.setText($('name' + n), p.name);
      PP.setText($('team' + n), p.team);
      $('team' + n).classList.toggle('has', !!p.team);
      PP.setText($('char' + n), PP.charName(p.character));
      PP.setImg($('img' + n), PP.art(p.character, p.alt));
      fitName(n);
      if (i === 1) $('art2').classList.toggle('mirror', !!s.mirrorPlayer2);
      if (changed) {
        const dir = i === 0 ? 'left' : 'right';
        PP.slideIn($('art' + n), dir, 80);
        PP.slideIn($('plate' + n), dir, 0);
      }
    });
    const round = PP.roundLabel(s);
    const centerKey = [round, s.tournament, s.bestOf];
    PP.setText($('tournament'), s.tournament);
    PP.setText($('round'), round);
    $('round').classList.toggle('reset', !!(s.grandFinals.on && s.grandFinals.reset));
    PP.setText($('bestof'), 'Best of ' + s.bestOf);
    if (!prev || !PP.same(centerKey, [PP.roundLabel(prev), prev.tournament, prev.bestOf])) {
      PP.slideIn($('center'), 'down', 100);
      PP.anim($('vs'), [{ opacity: 0, transform: 'scale(.4) rotate(-90deg)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 150 });
    }
  });
  document.fonts.ready.then(() => { fitName(1); fitName(2); });
</script>
</body>
</html>
